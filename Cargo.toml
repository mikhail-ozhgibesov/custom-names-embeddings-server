[package]
name = "custom-names-embeddings-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "ct4-h016 names-embedding server: native Rust forward + ONNX Runtime reference (CPU)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "custom-names-embeddings-server"
path = "src/main.rs"

[dependencies]
# ONNX Runtime 1.24 via the safe Rust wrapper. Pinned exactly for reproducible
# builds; the prebuilt static libonnxruntime.a is fetched & cached by ort-sys.
ort = "=2.0.0-rc.12"
ndarray = "0.17"                       # head math (shares ort's matrixmultiply)
matrixmultiply = "0.3"                 # sgemm with runtime AVX2/FMA dispatch (native engine)
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prometheus = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
anyhow = "1"
num_cpus = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
